<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Circuito 3D</title>
<style>
  :root { --accent:#ffcc00; --panel:rgba(10,14,24,.62); --text:#f4f6fb; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b0f18; color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select:none; -webkit-user-select:none; }
  canvas#game { display:block; }
  .panel { position:fixed; background:var(--panel); backdrop-filter:blur(6px); border-radius:12px; padding:10px 14px; pointer-events:none; }
  #info { top:14px; left:14px; min-width:170px; }
  #info .row { display:flex; justify-content:space-between; gap:18px; font-size:14px; line-height:1.7; }
  #info .row b { font-variant-numeric:tabular-nums; }
  #info .big { font-size:26px; font-weight:800; color:var(--accent); }
  #speedo { right:14px; bottom:14px; text-align:right; min-width:170px; }
  #speed { font-size:48px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1; }
  #speedo small { opacity:.7; font-size:13px; }
  #nitroWrap { margin-top:8px; height:10px; background:rgba(255,255,255,.15); border-radius:6px; overflow:hidden; }
  #nitro { height:100%; width:100%; background:linear-gradient(90deg,#00c2ff,#7b5cff); }
  #nitroLbl { font-size:11px; opacity:.75; margin-top:3px; }
  #minimap { position:fixed; top:14px; right:14px; background:var(--panel); border-radius:12px; }
  #center { position:fixed; top:34%; left:0; right:0; text-align:center; font-size:110px; font-weight:900;
    color:var(--accent); text-shadow:0 6px 30px rgba(0,0,0,.6); pointer-events:none; }
  #msg { position:fixed; top:20%; left:0; right:0; text-align:center; font-size:30px; font-weight:800;
    text-shadow:0 3px 14px rgba(0,0,0,.7); pointer-events:none; transition:opacity .3s; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(10,14,24,.55), rgba(10,14,24,.92)); padding:16px; }
  .card { max-width:520px; width:100%; text-align:center; background:rgba(20,26,40,.85); border:1px solid rgba(255,255,255,.08);
    border-radius:18px; padding:28px 26px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .card h1 { margin:0 0 4px; font-size:42px; letter-spacing:1px; font-style:italic;
    background:linear-gradient(90deg,#ffcc00,#ff5e3a); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card p { opacity:.8; margin:6px 0 18px; }
  .keys { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; text-align:left; font-size:14px; margin:0 auto 22px; max-width:340px; }
  kbd { background:#2a3350; border-radius:5px; padding:2px 7px; font-family:inherit; font-size:12px; border-bottom:2px solid #11172a; }
  button.go { background:linear-gradient(90deg,#ffcc00,#ff7a2f); color:#1a1200; border:0; border-radius:12px;
    padding:14px 36px; font-size:20px; font-weight:900; cursor:pointer; box-shadow:0 8px 24px rgba(255,140,0,.35); }
  button.go:hover { filter:brightness(1.08); }
  #results table { margin:0 auto 18px; border-collapse:collapse; font-size:15px; }
  #results td { padding:4px 12px; text-align:left; font-variant-numeric:tabular-nums; }
  #results tr.me td { color:var(--accent); font-weight:800; }
  .hidden { display:none !important; }
  #touch { position:fixed; inset:auto 0 0 0; height:150px; pointer-events:none; }
  #touch .tb { position:absolute; bottom:18px; width:74px; height:74px; border-radius:50%; background:rgba(255,255,255,.16);
    border:2px solid rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center; font-size:28px; pointer-events:auto; }
  @media (max-width:640px) {
    #center { font-size:80px; }
    #speed { font-size:34px; }
    #speedo { bottom:110px; min-width:120px; }
    #info { min-width:140px; }
    #info .row { font-size:12px; }
    #info .big { font-size:20px; }
    #minimap { width:120px; height:120px; }
    .card h1 { font-size:32px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="info" class="panel">
  <div class="row"><span>Posição</span><b class="big" id="pos">4º/4</b></div>
  <div class="row"><span>Volta</span><b id="lap">1/3</b></div>
  <div class="row"><span>Tempo</span><b id="time">00:00.00</b></div>
  <div class="row"><span>Volta atual</span><b id="lapTime">00:00.00</b></div>
  <div class="row"><span>Melhor volta</span><b id="best">--:--.--</b></div>
</div>

<div id="speedo" class="panel">
  <div id="speed">0</div><small>km/h</small>
  <div id="nitroWrap"><div id="nitro"></div></div>
  <div id="nitroLbl">TURBO (Shift)</div>
</div>

<canvas id="minimap" width="180" height="180"></canvas>
<div id="center"></div>
<div id="msg"></div>

<div id="touch" class="hidden">
  <div class="tb" data-k="left"  style="left:18px">◀</div>
  <div class="tb" data-k="right" style="left:104px">▶</div>
  <div class="tb" data-k="boost" style="right:190px">⚡</div>
  <div class="tb" data-k="down"  style="right:104px">▼</div>
  <div class="tb" data-k="up"    style="right:18px">▲</div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>TURBO CIRCUITO</h1>
    <p>3 voltas, 4 carros. Chegue em primeiro!</p>
    <div class="keys">
      <span><kbd>W</kbd> <kbd>↑</kbd></span><span>Acelerar</span>
      <span><kbd>S</kbd> <kbd>↓</kbd></span><span>Frear / ré</span>
      <span><kbd>A</kbd> <kbd>D</kbd> <kbd>←</kbd> <kbd>→</kbd></span><span>Virar</span>
      <span><kbd>Shift</kbd></span><span>Turbo</span>
      <span><kbd>C</kbd></span><span>Trocar câmera</span>
      <span><kbd>P</kbd> <kbd>M</kbd> <kbd>R</kbd></span><span>Pausar · Som · Reiniciar</span>
    </div>
    <button class="go" id="startBtn">CORRER!</button>
  </div>
</div>

<div id="results" class="overlay hidden">
  <div class="card">
    <h1 id="resTitle">1º LUGAR!</h1>
    <p id="resSub"></p>
    <table id="resTable"></table>
    <button class="go" id="againBtn">CORRER DE NOVO</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

// ---------- Configuração ----------
const LAPS = 3;
const HW = 7;            // meia largura da pista
const WALL = HW + 15;    // distância do muro ao centro
const N = 1200;          // amostras da pista

// ---------- Renderizador / cena ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
const SKY = 0x9fd3ff;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 160, 720);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 2000);

scene.add(new THREE.HemisphereLight(0xe8f4ff, 0x3f6b2c, 0.8));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 1, far: 320 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const SUN_OFFSET = new THREE.Vector3(60, 110, 40);

// ---------- Texturas de canvas ----------
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.anisotropy = maxAniso;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
function noise(ctx, w, h, n, colors) {
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = colors[(Math.random() * colors.length) | 0];
    ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
}
const asphaltTex = canvasTex(256, 512, (c, w, h) => {
  c.fillStyle = '#3a3b40'; c.fillRect(0, 0, w, h);
  noise(c, w, h, 9000, ['#333438', '#43444a', '#2e2f33', '#4a4b50']);
  c.fillStyle = '#eeeeee';
  c.fillRect(8, 0, 8, h); c.fillRect(w - 16, 0, 8, h);
  c.fillRect(w / 2 - 4, 0, 8, h / 2);
});
const curbTex = canvasTex(16, 64, (c, w, h) => {
  c.fillStyle = '#d62828'; c.fillRect(0, 0, w, h / 2);
  c.fillStyle = '#f3f3f3'; c.fillRect(0, h / 2, w, h / 2);
});
const wallTex = canvasTex(16, 64, (c, w, h) => {
  c.fillStyle = '#f3f3f3'; c.fillRect(0, 0, w, h / 2);
  c.fillStyle = '#1d4ed8'; c.fillRect(0, h / 2, w, h / 2);
});
const grassTex = canvasTex(256, 256, (c, w, h) => {
  c.fillStyle = '#4f8f36'; c.fillRect(0, 0, w, h);
  noise(c, w, h, 7000, ['#4a8732', '#5a9c3e', '#46802f', '#62a544']);
}, 140, 140);
const checkerTex = canvasTex(128, 32, (c) => {
  for (let x = 0; x < 8; x++) for (let y = 0; y < 2; y++) {
    c.fillStyle = (x + y) % 2 ? '#111' : '#fafafa'; c.fillRect(x * 16, y * 16, 16, 16);
  }
});
const bannerTex = canvasTex(512, 64, (c, w, h) => {
  c.fillStyle = '#c1121f'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#fff'; c.font = 'bold 44px system-ui, sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('LARGADA  ·  TURBO CIRCUITO', w / 2, h / 2 + 2);
});
bannerTex.wrapS = bannerTex.wrapT = THREE.ClampToEdgeWrapping;

// ---------- Pista ----------
const CTRL = [
  [0, -150], [120, -160], [200, -110], [230, -20], [180, 40], [110, 30], [70, 80],
  [110, 150], [60, 210], [-40, 200], [-110, 150], [-190, 170], [-240, 100],
  [-210, 0], [-150, -40], [-170, -110], [-100, -160]
].map(([x, z]) => new THREE.Vector3(x, 0, z));
const curve = new THREE.CatmullRomCurve3(CTRL, true, 'centripetal');
const P = curve.getSpacedPoints(N); P.pop();
const T = [], NM = [];
for (let i = 0; i < N; i++) {
  const t = P[(i + 1) % N].clone().sub(P[(i - 1 + N) % N]).normalize();
  T.push(t); NM.push(new THREE.Vector3(-t.z, 0, t.x));
}
const SEG = curve.getLength() / N;

function ribbon(offA, offB, yA, yB, vScale) {
  const pos = [], uv = [], idx = [];
  let d = 0;
  for (let i = 0; i <= N; i++) {
    const k = i % N, p = P[k], n = NM[k];
    pos.push(p.x + n.x * offA, yA, p.z + n.z * offA, p.x + n.x * offB, yB, p.z + n.z * offB);
    uv.push(0, d / vScale, 1, d / vScale);
    d += SEG;
    if (i < N) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function addMesh(geo, mat, { cast = false, receive = true } = {}) {
  const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = receive; scene.add(m); return m;
}
addMesh(ribbon(HW, -HW, 0.03, 0.03, 12), new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.92, side: THREE.DoubleSide }));
const curbMat = new THREE.MeshStandardMaterial({ map: curbTex, roughness: 0.7, side: THREE.DoubleSide });
addMesh(ribbon(HW + 1.4, HW, 0.06, 0.06, 3), curbMat);
addMesh(ribbon(-HW, -HW - 1.4, 0.06, 0.06, 3), curbMat);
// faixa de areia/escape
const runoffMat = new THREE.MeshStandardMaterial({ color: 0xcdb98a, roughness: 1, side: THREE.DoubleSide });
addMesh(ribbon(HW + 6, HW + 1.4, 0.02, 0.02, 10), runoffMat);
addMesh(ribbon(-HW - 1.4, -HW - 6, 0.02, 0.02, 10), runoffMat);
const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.6, side: THREE.DoubleSide });
addMesh(ribbon(WALL, WALL, 0, 1.3, 6), wallMat, { cast: true });
addMesh(ribbon(-WALL, -WALL, 0, 1.3, 6), wallMat, { cast: true });

const ground = addMesh(new THREE.PlaneGeometry(2400, 2400), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;

const headingOf = (t) => Math.atan2(t.x, t.z);

// Linha de largada + pórtico
{
  const g = new THREE.Group();
  g.position.copy(P[0]); g.rotation.y = headingOf(T[0]);
  const line = new THREE.Mesh(new THREE.PlaneGeometry(2 * HW, 3), new THREE.MeshStandardMaterial({ map: checkerTex, roughness: 0.8 }));
  line.rotation.x = -Math.PI / 2; line.position.y = 0.05; line.receiveShadow = true; g.add(line);
  const postMat = new THREE.MeshStandardMaterial({ color: 0x2b2d42, metalness: 0.5, roughness: 0.4 });
  for (const s of [-1, 1]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.8, 8, 0.8), postMat);
    post.position.set(s * (HW + 2.5), 4, 0); post.castShadow = true; g.add(post);
  }
  const banner = new THREE.Mesh(new THREE.BoxGeometry(2 * HW + 5.8, 1.8, 0.6),
    new THREE.MeshStandardMaterial({ map: bannerTex, roughness: 0.6 }));
  banner.position.y = 7.6; banner.castShadow = true; g.add(banner);
  scene.add(g);
}

// Arquibancada
const STAND_AT = 40;
const standPos = P[STAND_AT].clone().addScaledVector(NM[STAND_AT], -(WALL + 4));
{
  const g = new THREE.Group();
  g.position.copy(standPos); g.rotation.y = headingOf(T[STAND_AT]);
  const cols = [0x8d99ae, 0xe63946, 0x8d99ae, 0x457b9d, 0x8d99ae, 0xf4a261];
  cols.forEach((c, k) => {
    const step = new THREE.Mesh(new THREE.BoxGeometry(3, 1 + k, 70), new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 }));
    step.position.set(k * 3, (1 + k) / 2, 0); step.castShadow = step.receiveShadow = true; g.add(step);
  });
  const roof = new THREE.Mesh(new THREE.BoxGeometry(20, 0.5, 74), new THREE.MeshStandardMaterial({ color: 0xedf2f4 }));
  roof.position.set(8, 12, 0); roof.castShadow = true; g.add(roof);
  for (const z of [-34, 0, 34]) {
    const col = new THREE.Mesh(new THREE.BoxGeometry(0.6, 12, 0.6), new THREE.MeshStandardMaterial({ color: 0x555b6e }));
    col.position.set(17, 6, z); g.add(col);
  }
  scene.add(g);
}

// Árvores (instanciadas)
function distToTrack(x, z) {
  let best = Infinity;
  for (let i = 0; i < N; i += 3) { const dx = P[i].x - x, dz = P[i].z - z; const d = dx * dx + dz * dz; if (d < best) best = d; }
  return Math.sqrt(best);
}
{
  const COUNT = 420;
  const trunkGeo = new THREE.CylinderGeometry(0.35, 0.55, 3, 6); trunkGeo.translate(0, 1.5, 0);
  const leafGeo = new THREE.ConeGeometry(3, 7.5, 7); leafGeo.translate(0, 6.6, 0);
  const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 1 }), COUNT);
  const leaves = new THREE.InstancedMesh(leafGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }), COUNT);
  trunks.castShadow = leaves.castShadow = true;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), col = new THREE.Color();
  let placed = 0, tries = 0;
  while (placed < COUNT && tries < 20000) {
    tries++;
    const x = (Math.random() - 0.5) * 760, z = (Math.random() - 0.5) * 640;
    if (distToTrack(x, z) < WALL + 7) continue;
    if (Math.hypot(x - standPos.x, z - standPos.z) < 45) continue;
    const k = 0.7 + Math.random() * 0.8;
    p.set(x, 0, z); q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * 6.28); s.set(k, k * (0.85 + Math.random() * 0.4), k);
    m.compose(p, q, s);
    trunks.setMatrixAt(placed, m); leaves.setMatrixAt(placed, m);
    leaves.setColorAt(placed, col.setHSL(0.27 + Math.random() * 0.08, 0.55, 0.22 + Math.random() * 0.12));
    placed++;
  }
  trunks.count = leaves.count = placed;
  scene.add(trunks, leaves);
}
// Montanhas ao fundo
{
  const mat = new THREE.MeshStandardMaterial({ color: 0x6f8f7a, roughness: 1, flatShading: true });
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * Math.PI * 2 + Math.random() * 0.2, r = 520 + Math.random() * 120;
    const h = 60 + Math.random() * 90;
    const mtn = new THREE.Mesh(new THREE.ConeGeometry(70 + Math.random() * 60, h, 6), mat);
    mtn.position.set(Math.cos(a) * r, h / 2 - 2, Math.sin(a) * r);
    scene.add(mtn);
  }
}

// ---------- Carros ----------
function makeCar(color) {
  const car = new THREE.Group();
  const chassis = new THREE.Group(); car.add(chassis);
  const paint = new THREE.MeshStandardMaterial({ color, metalness: 0.45, roughness: 0.32 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.7 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x1c2a3a, metalness: 0.9, roughness: 0.08 });
  const add = (geo, mat, x, y, z, parent = chassis) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m; };
  add(new THREE.BoxGeometry(2.0, 0.55, 4.2), paint, 0, 0.62, 0);
  add(new THREE.BoxGeometry(1.8, 0.28, 1.0), paint, 0, 0.48, 2.45);
  add(new THREE.BoxGeometry(1.55, 0.55, 1.9), glass, 0, 1.15, -0.35);
  add(new THREE.BoxGeometry(2.2, 0.1, 0.55), dark, 0, 1.3, -2.0);
  add(new THREE.BoxGeometry(0.12, 0.4, 0.2), dark, -0.7, 1.05, -2.0);
  add(new THREE.BoxGeometry(0.12, 0.4, 0.2), dark, 0.7, 1.05, -2.0);
  add(new THREE.BoxGeometry(0.3, 0.6, 4.3), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }), 0, 0.62, 0).scale.set(1, 1.02, 1);
  const headMat = new THREE.MeshStandardMaterial({ color: 0xfff6c8, emissive: 0xfff2a8, emissiveIntensity: 0.6 });
  const tailMat = new THREE.MeshStandardMaterial({ color: 0x550000, emissive: 0xff1a1a, emissiveIntensity: 0.3 });
  for (const s of [-1, 1]) {
    add(new THREE.BoxGeometry(0.45, 0.18, 0.08), headMat, s * 0.65, 0.7, 2.11);
    add(new THREE.BoxGeometry(0.5, 0.16, 0.08), tailMat, s * 0.62, 0.75, -2.11);
  }
  const wheelGeo = new THREE.CylinderGeometry(0.46, 0.46, 0.42, 18);
  const tire = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
  const rim = new THREE.MeshStandardMaterial({ color: 0xbfc4cc, metalness: 0.8, roughness: 0.3 });
  const wheels = [], fronts = [];
  for (const [x, z] of [[-1.05, 1.4], [1.05, 1.4], [-1.05, -1.4], [1.05, -1.4]]) {
    const pivot = new THREE.Group(); pivot.position.set(x, 0.46, z); car.add(pivot);
    const w = new THREE.Mesh(wheelGeo, tire); w.rotation.z = Math.PI / 2; w.castShadow = true; pivot.add(w);
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.44, 8), rim); w.add(r);
    wheels.push(w); if (z > 0) fronts.push(pivot);
  }
  car.userData = { chassis, wheels, fronts, tailMat };
  scene.add(car);
  return car;
}
function animateCar(car, speed, steer, dt, braking) {
  const u = car.userData;
  for (const w of u.wheels) w.rotation.x += speed * dt / 0.46;
  for (const f of u.fronts) f.rotation.y = steer * 0.45;
  u.chassis.rotation.z = THREE.MathUtils.lerp(u.chassis.rotation.z, -steer * Math.min(Math.abs(speed) / 60, 1) * 0.07, 0.15);
  u.tailMat.emissiveIntensity = braking ? 2.2 : 0.3;
}

// ---------- Estado ----------
const player = {
  name: 'Você', color: 0xe63946, mesh: makeCar(0xe63946),
  pos: new THREE.Vector3(), heading: 0, speed: 0, steer: 0, idx: 0, lat: 0,
  crossings: 0, nitro: 100, finished: false, finishTime: 0, boosting: false
};
const AI_DEFS = [
  { name: 'Azul',  color: 0x1d7cf2, maxV: 66 },
  { name: 'Verde', color: 0x2bb673, maxV: 63 },
  { name: 'Roxo',  color: 0x9b5de5, maxV: 60 }
];
const ais = AI_DEFS.map(d => ({ ...d, mesh: makeCar(d.color), s: 0, v: 0, lat: 0, baseLat: 0, crossings: 0, finished: false, finishTime: 0, steer: 0, prevHeading: 0 }));

let state = 'menu';      // menu | countdown | race | finished
let paused = false;
let raceTime = 0, lapStart = 0, bestLap = Infinity, countdown = 0, lastBeep = 4;
let finishOrder = [];
let camMode = 0, camHeading = 0;
const keys = { up: false, down: false, left: false, right: false, boost: false };

const progressOf = (c) => c === player ? c.crossings * N + c.idx : c.crossings * N + c.s;

function nearestIdx(pos, hint, win) {
  let best = hint, bd = Infinity;
  for (let k = -win; k <= win; k++) {
    const i = ((hint + k) % N + N) % N;
    const dx = P[i].x - pos.x, dz = P[i].z - pos.z, d = dx * dx + dz * dz;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
function trackPoint(s, lat, out) {
  const f = Math.floor(s), i0 = ((f % N) + N) % N, i1 = (i0 + 1) % N, t = s - f;
  out.lerpVectors(P[i0], P[i1], t);
  out.x += NM[i0].x * lat; out.z += NM[i0].z * lat;
  return out;
}

function resetRace() {
  const grid = [
    { c: ais[0], s: N - 8,  lat: 3.5 },
    { c: ais[1], s: N - 8,  lat: -3.5 },
    { c: ais[2], s: N - 18, lat: 3.5 },
    { c: player, s: N - 18, lat: -3.5 }
  ];
  const tmp = new THREE.Vector3();
  for (const g of grid) {
    const c = g.c;
    c.crossings = 0; c.finished = false; c.finishTime = 0; c.steer = 0;
    if (c === player) {
      trackPoint(g.s, g.lat, c.pos);
      c.heading = headingOf(T[g.s]); c.speed = 0; c.idx = g.s; c.lat = g.lat; c.nitro = 100;
      c.mesh.position.copy(c.pos); c.mesh.rotation.y = c.heading;
    } else {
      c.s = g.s; c.v = 0; c.lat = c.baseLat = g.lat;
      trackPoint(c.s, c.lat, tmp); c.mesh.position.copy(tmp); c.mesh.rotation.y = headingOf(T[g.s]);
    }
  }
  raceTime = 0; lapStart = 0; bestLap = Infinity; finishOrder = []; lastBeep = 4;
  camHeading = player.heading;
  placeCamera(1);
  document.getElementById('best').textContent = '--:--.--';
  document.getElementById('results').classList.add('hidden');
}

function startCountdown() {
  resetRace();
  state = 'countdown'; countdown = 3;
}

// ---------- Entrada ----------
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right', ShiftLeft: 'boost', ShiftRight: 'boost' };
addEventListener('keydown', (e) => {
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (e.repeat) return;
  if (e.code === 'KeyC') camMode = (camMode + 1) % 3;
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'KeyP' && (state === 'race' || state === 'countdown')) { paused = !paused; showMsg(paused ? 'PAUSADO' : '', paused ? 1e9 : 0); }
  if (e.code === 'KeyR' && state !== 'menu') { paused = false; showMsg('', 0); startCountdown(); }
  if ((e.code === 'Enter' || e.code === 'Space') && state === 'menu') begin();
});
addEventListener('keyup', (e) => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  const tc = document.getElementById('touch'); tc.classList.remove('hidden');
  tc.querySelectorAll('.tb').forEach(b => {
    const k = b.dataset.k;
    const on = (e) => { e.preventDefault(); keys[k] = true; b.style.background = 'rgba(255,204,0,.45)'; };
    const off = (e) => { e.preventDefault(); keys[k] = false; b.style.background = ''; };
    b.addEventListener('touchstart', on, { passive: false });
    b.addEventListener('touchend', off, { passive: false });
    b.addEventListener('touchcancel', off, { passive: false });
  });
}

function begin() {
  document.getElementById('menu').classList.add('hidden');
  initAudio();
  startCountdown();
}
document.getElementById('startBtn').addEventListener('click', begin);
document.getElementById('againBtn').addEventListener('click', startCountdown);

// ---------- Áudio ----------
let actx = null, osc1, osc2, filt, gainNode, muted = false;
function initAudio() {
  if (actx) { actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    osc1 = actx.createOscillator(); osc1.type = 'sawtooth';
    osc2 = actx.createOscillator(); osc2.type = 'square';
    filt = actx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 900;
    gainNode = actx.createGain(); gainNode.gain.value = 0;
    osc1.connect(filt); osc2.connect(filt); filt.connect(gainNode); gainNode.connect(actx.destination);
    osc1.start(); osc2.start();
  } catch (e) { actx = null; }
}
function beep(freq, dur) {
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square'; o.frequency.value = freq; g.gain.value = 0.08;
  g.gain.setTargetAtTime(0, actx.currentTime + dur * 0.7, 0.03);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
}
const GEARS = [0, 13, 24, 36, 48, 62, 90];
function updateAudio() {
  if (!actx) return;
  const sp = Math.abs(player.speed);
  let g = 1; while (g < GEARS.length - 1 && sp > GEARS[g]) g++;
  const frac = (sp - GEARS[g - 1]) / (GEARS[g] - GEARS[g - 1]);
  const f = 55 + frac * 120 + g * 12 + (player.boosting ? 25 : 0);
  const t = actx.currentTime;
  osc1.frequency.setTargetAtTime(f, t, 0.04);
  osc2.frequency.setTargetAtTime(f * 0.5, t, 0.04);
  filt.frequency.setTargetAtTime(500 + frac * 900 + (keys.up ? 400 : 0), t, 0.05);
  const active = (state === 'race' || state === 'countdown' || state === 'finished') && !paused && !muted;
  gainNode.gain.setTargetAtTime(active ? 0.035 + (keys.up ? 0.025 : 0) : 0, t, 0.08);
}

// ---------- HUD ----------
const $ = (id) => document.getElementById(id);
const hud = { pos: $('pos'), lap: $('lap'), time: $('time'), lapTime: $('lapTime'), best: $('best'), speed: $('speed'), nitro: $('nitro'), center: $('center'), msg: $('msg') };
function fmt(t) {
  if (!isFinite(t)) return '--:--.--';
  const m = Math.floor(t / 60), s = Math.floor(t % 60), c = Math.floor((t * 100) % 100);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(c).padStart(2, '0')}`;
}
let msgTimer = 0;
function showMsg(text, dur = 1.6) { hud.msg.textContent = text; hud.msg.style.opacity = text ? 1 : 0; msgTimer = dur; }

function placeOf(c) {
  const fi = finishOrder.indexOf(c);
  if (fi >= 0) return fi + 1;
  const all = [player, ...ais];
  const pr = progressOf(c);
  return 1 + finishOrder.length + all.filter(o => o !== c && !o.finished && progressOf(o) > pr).length;
}

// Minimapa
const mm = $('minimap'), mctx = mm.getContext('2d');
let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
for (const p of P) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); }
const mmScale = 156 / Math.max(maxX - minX, maxZ - minZ);
const mmX = (x) => 12 + (x - minX) * mmScale + (156 - (maxX - minX) * mmScale) / 2;
const mmY = (z) => 12 + (z - minZ) * mmScale + (156 - (maxZ - minZ) * mmScale) / 2;
const mmBase = document.createElement('canvas'); mmBase.width = mmBase.height = 180;
{
  const c = mmBase.getContext('2d');
  c.lineJoin = 'round';
  c.beginPath(); P.forEach((p, i) => i ? c.lineTo(mmX(p.x), mmY(p.z)) : c.moveTo(mmX(p.x), mmY(p.z))); c.closePath();
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 6; c.stroke();
  c.strokeStyle = '#444'; c.lineWidth = 3.5; c.stroke();
  c.fillStyle = '#fff'; c.fillRect(mmX(P[0].x) - 1.5, mmY(P[0].z) - 5, 3, 10);
}
function drawMinimap() {
  mctx.clearRect(0, 0, 180, 180);
  mctx.drawImage(mmBase, 0, 0);
  const dot = (x, z, color, r) => { mctx.beginPath(); mctx.arc(mmX(x), mmY(z), r, 0, 6.29); mctx.fillStyle = color; mctx.fill(); mctx.lineWidth = 1.5; mctx.strokeStyle = '#000'; mctx.stroke(); };
  for (const a of ais) dot(a.mesh.position.x, a.mesh.position.z, '#' + a.color.toString(16).padStart(6, '0'), 4);
  dot(player.pos.x, player.pos.z, '#ffcc00', 5.5);
}

// ---------- Física do jogador ----------
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();
let wallHit = 0, offMsgCool = 0;
function updatePlayer(dt) {
  const p = player;
  const canDrive = state === 'race' && !p.finished;
  const up = canDrive && keys.up, down = canDrive && keys.down;
  const off = Math.abs(p.lat) > HW + 1.4;

  p.boosting = canDrive && keys.boost && p.nitro > 1 && p.speed > 5;
  if (p.boosting) p.nitro = Math.max(0, p.nitro - 32 * dt);
  else p.nitro = Math.min(100, p.nitro + 7 * dt);

  let maxS = off ? 24 : 60, acc = 24;
  if (p.boosting) { maxS = off ? 30 : 82; acc = 42; }

  if (up) p.speed += acc * dt * (p.speed < 0 ? 2 : 1 - Math.max(0, p.speed) / maxS * 0.55);
  if (down) p.speed -= (p.speed > 0 ? 48 : 14) * dt;
  if (p.finished) p.speed -= Math.sign(p.speed) * 10 * dt;
  p.speed = Math.max(p.speed, -14);
  p.speed -= p.speed * (off ? 1.1 : 0.12) * dt;
  if (!up && !down && Math.abs(p.speed) < 0.4) p.speed = 0;
  if (!up && !down) p.speed -= Math.sign(p.speed) * 3 * dt;
  if (p.speed > maxS) p.speed -= (p.speed - maxS) * 2.2 * dt;

  let steerIn = 0;
  if (canDrive) steerIn = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
  else if (p.finished) { // piloto automático depois da chegada
    const target = headingOf(T[(p.idx + 15) % N]) ;
    let d = target - p.heading; d = Math.atan2(Math.sin(d), Math.cos(d));
    steerIn = THREE.MathUtils.clamp(d * 2 - p.lat * 0.05, -1, 1);
  }
  p.steer += (steerIn - p.steer) * Math.min(1, dt * 8);
  const spd = Math.abs(p.speed);
  const turn = 2.3 * p.steer * THREE.MathUtils.clamp(p.speed / 10, -1, 1) * (1 - Math.min(spd, 85) / 85 * 0.45);
  p.heading += turn * dt;

  p.pos.x += Math.sin(p.heading) * p.speed * dt;
  p.pos.z += Math.cos(p.heading) * p.speed * dt;

  // localização na pista / voltas
  const old = p.idx;
  p.idx = nearestIdx(p.pos, p.idx, 50);
  const delta = p.idx - old;
  if (delta < -N / 2) onPlayerCross(+1);
  else if (delta > N / 2) onPlayerCross(-1);
  p.lat = tmpV.copy(p.pos).sub(P[p.idx]).dot(NM[p.idx]);

  // muro
  const lim = WALL - 1.3;
  if (Math.abs(p.lat) > lim) {
    const push = p.lat - Math.sign(p.lat) * lim;
    p.pos.addScaledVector(NM[p.idx], -push);
    p.lat = Math.sign(p.lat) * lim;
    const th = headingOf(T[p.idx]);
    let d = th - p.heading; d = Math.atan2(Math.sin(d), Math.cos(d));
    if (Math.abs(d) < Math.PI / 2) p.heading += d * 0.25;
    if (wallHit <= 0) { p.speed *= 0.7; wallHit = 0.4; }
    p.speed *= (1 - 1.5 * dt);
  }
  wallHit -= dt;

  if (off && canDrive && p.speed > 20 && offMsgCool <= 0) { showMsg('Fora da pista!', 1); offMsgCool = 3; }
  offMsgCool -= dt;

  // colisão com IA
  for (const a of ais) {
    tmpV.subVectors(p.pos, a.mesh.position); tmpV.y = 0;
    const d = tmpV.length();
    if (d < 3.4 && d > 0.001) {
      tmpV.multiplyScalar(1 / d);
      p.pos.addScaledVector(tmpV, (3.4 - d) * 0.7);
      a.lat -= tmpV.dot(NM[Math.floor(a.s) % N]) * (3.4 - d) * 0.3;
      const fwd = tmpV2.set(Math.sin(p.heading), 0, Math.cos(p.heading));
      if (fwd.dot(tmpV) < -0.3) p.speed *= 0.93; else a.v *= 0.95;
    }
  }

  p.mesh.position.copy(p.pos);
  p.mesh.rotation.y = p.heading;
  animateCar(p.mesh, p.speed, p.steer, dt, down && p.speed > 0);
}

function onPlayerCross(dir) {
  const p = player;
  p.crossings += dir;
  if (dir < 0 || state !== 'race') return;
  if (p.crossings >= 2) {
    const lt = raceTime - lapStart; lapStart = raceTime;
    if (lt < bestLap) { bestLap = lt; hud.best.textContent = fmt(bestLap); if (p.crossings <= LAPS) showMsg('Melhor volta! ' + fmt(lt), 2); }
  }
  if (p.crossings === LAPS && LAPS > 1) showMsg('VOLTA FINAL!', 2);
  if (p.crossings === LAPS + 1 && !p.finished) {
    p.finished = true; p.finishTime = raceTime; finishOrder.push(p);
    state = 'finished';
    beep(880, 0.25); setTimeout(() => beep(1320, 0.4), 220);
    setTimeout(showResults, 1600);
  }
}

// ---------- IA ----------
function updateAI(dt) {
  const pp = progressOf(player);
  const others = [player, ...ais];
  for (const a of ais) {
    const i = Math.floor(a.s) % N;
    // velocidade alvo pela curvatura à frente
    let curv = 0;
    for (const k of [15, 35, 60]) curv = Math.max(curv, 1 - T[i].dot(T[(i + k) % N]));
    let target = a.maxV * THREE.MathUtils.clamp(1 - curv * 1.5, 0.5, 1);
    // elástico leve para manter a corrida disputada
    const gap = (progressOf(a) - pp) * SEG;
    target *= THREE.MathUtils.clamp(1 - gap / 1200, 0.9, 1.15);
    if (a.finished) target *= 0.55;

    // ultrapassagem / desvio
    let tl = a.baseLat;
    for (const o of others) {
      if (o === a) continue;
      const ahead = (progressOf(o) - progressOf(a)) * SEG;
      const olat = o.lat;
      if (ahead > 0 && ahead < 16 && Math.abs(olat - a.lat) < 3.6) {
        tl = olat > 0 ? olat - 4.4 : olat + 4.4;
        if (ahead < 7) target = Math.min(target, (o === player ? player.speed : o.v) - 1);
      }
    }
    tl = THREE.MathUtils.clamp(tl, -(HW - 1.6), HW - 1.6);
    a.lat += THREE.MathUtils.clamp(tl - a.lat, -4.5 * dt, 4.5 * dt);
    a.lat = THREE.MathUtils.clamp(a.lat, -(HW - 1), HW - 1);

    if (state === 'race' || state === 'finished') a.v += THREE.MathUtils.clamp(target - a.v, -22 * dt, 15 * dt);
    else a.v = 0;
    a.v = Math.max(0, a.v);

    a.s += a.v * dt / SEG;
    if (a.s >= N) {
      a.s -= N; a.crossings++;
      if (a.crossings === LAPS + 1 && !a.finished) { a.finished = true; a.finishTime = raceTime; finishOrder.push(a); }
    }
    trackPoint(a.s, a.lat, a.mesh.position);
    trackPoint(a.s + 3, a.lat, tmpV);
    const h = Math.atan2(tmpV.x - a.mesh.position.x, tmpV.z - a.mesh.position.z);
    let dh = h - a.mesh.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    a.mesh.rotation.y += dh;
    a.steer += (THREE.MathUtils.clamp(dh * 30, -1, 1) - a.steer) * Math.min(1, dt * 5);
    animateCar(a.mesh, a.v, a.steer, dt, target < a.v - 3);
  }
}

// ---------- Câmera ----------
function placeCamera(k) {
  const p = player;
  let dh = p.heading - camHeading; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
  camHeading += dh * Math.min(1, k * 7);
  const fx = Math.sin(camHeading), fz = Math.cos(camHeading);
  if (camMode === 2) { // cabine
    camera.position.set(p.pos.x + Math.sin(p.heading) * 0.3, 1.55, p.pos.z + Math.cos(p.heading) * 0.3);
    camera.lookAt(p.pos.x + Math.sin(p.heading) * 20, 1.2, p.pos.z + Math.cos(p.heading) * 20);
    return;
  }
  const dist = camMode === 0 ? 10 : 17, hgt = camMode === 0 ? 4.2 : 8;
  tmpV.set(p.pos.x - fx * dist, hgt, p.pos.z - fz * dist);
  camera.position.lerp(tmpV, Math.min(1, k * 10));
  camera.lookAt(p.pos.x + fx * 4, 1.3, p.pos.z + fz * 4);
}

// ---------- Resultados ----------
function showResults() {
  const all = [player, ...ais].sort((a, b) => placeOf(a) - placeOf(b));
  const place = placeOf(player);
  $('resTitle').textContent = place === 1 ? '1º LUGAR! 🏆' : `${place}º LUGAR`;
  $('resSub').textContent = `Tempo total ${fmt(player.finishTime)} · Melhor volta ${fmt(bestLap)}`;
  $('resTable').innerHTML = all.map(c =>
    `<tr class="${c === player ? 'me' : ''}"><td>${placeOf(c)}º</td><td>${c.name}</td><td>${c.finished ? fmt(c.finishTime) : 'em corrida'}</td></tr>`
  ).join('');
  $('results').classList.remove('hidden');
}

// ---------- Loop ----------
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  update(Math.min(clock.getDelta(), 0.05));
  renderer.render(scene, camera);
}
function update(dt) {
  if (!paused) {
    if (state === 'countdown') {
      countdown -= dt;
      const n = Math.ceil(countdown);
      if (n !== lastBeep && n > 0) { beep(440, 0.18); lastBeep = n; }
      hud.center.textContent = n > 0 ? n : '';
      if (countdown <= 0) { state = 'race'; hud.center.textContent = 'VAI!'; beep(880, 0.4); setTimeout(() => { if (hud.center.textContent === 'VAI!') hud.center.textContent = ''; }, 800); }
    }
    if (state === 'race' || state === 'finished') raceTime += dt;
    if (state !== 'menu') { updatePlayer(dt); updateAI(dt); }
    else { // menu: câmera orbitando
      const t = performance.now() * 0.00006;
      camera.position.set(Math.cos(t) * 300, 140, Math.sin(t) * 300);
      camera.lookAt(0, 0, 20);
    }
    if (state !== 'menu') placeCamera(dt);
    if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) hud.msg.style.opacity = 0; }
  }

  // FOV dinâmico
  const targetFov = 64 + Math.max(0, player.speed) * 0.13 + (player.boosting ? 9 : 0);
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 4);
  camera.updateProjectionMatrix();

  // sombra acompanha o jogador
  const focus = state === 'menu' ? tmpV2.set(0, 0, 0) : player.pos;
  sun.position.copy(focus).add(SUN_OFFSET); sun.target.position.copy(focus);

  // HUD
  const lapShown = THREE.MathUtils.clamp(player.crossings, 1, LAPS);
  hud.lap.textContent = `${lapShown}/${LAPS}`;
  hud.pos.textContent = `${placeOf(player)}º/4`;
  hud.time.textContent = fmt(player.finished ? player.finishTime : raceTime);
  hud.lapTime.textContent = fmt(player.finished ? 0 : raceTime - lapStart);
  hud.speed.textContent = Math.round(Math.abs(player.speed) * 3.6);
  hud.nitro.style.width = player.nitro + '%';
  drawMinimap();
  updateAudio();
}
// gancho para testes automatizados
window.__race = { update, keys, P, SEG, player, ais, get state() { return state; }, get place() { return placeOf(player); } };

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'race' || state === 'countdown') && !paused) { paused = true; showMsg('PAUSADO', 1e9); }
});

resetRace();
tick();
})();
</script>
</body>
</html>
